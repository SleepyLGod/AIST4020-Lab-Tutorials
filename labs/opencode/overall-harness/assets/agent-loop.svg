<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="920" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc">
  <title id="title">How the Harness Runs an Agent Task</title>
  <desc id="desc">The user asks OpenCode to fix the average and rerun the test. OpenCode prepares model input from that request, instructions, tool descriptions and available session history. The model generates text and may request tools. OpenCode checks permissions before running a tool. It records the output, error, or reason the tool was blocked. If the run continues, that result informs the next model call. The final answer goes back to the user. The loop is part of the harness.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#52606d"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #202a32; }
      .heading { font-size: 27px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; }
      .detail { font-size: 17px; }
      .small { font-size: 16px; fill: #52606d; }
      .line { fill: none; stroke: #52606d; stroke-width: 2; marker-end: url(#arrow); }
      .app { fill: #eef7f3; stroke: #278060; stroke-width: 1.5; }
      .model { fill: #eef3fd; stroke: #416cba; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1000" height="920" fill="#ffffff"/>
  <text x="40" y="46" class="heading">How the Harness Runs an Agent Task</text>
  <rect x="40" y="69" width="15" height="15" fill="#eef3fd" stroke="#416cba"/>
  <text x="65" y="82" class="small">Model</text>
  <rect x="150" y="69" width="15" height="15" fill="#eef7f3" stroke="#278060"/>
  <text x="175" y="82" class="small">OpenCode</text>
  <text x="315" y="82" class="small">Simplified flow for this lab</text>

  <rect x="40" y="118" width="420" height="72" rx="6" fill="#f5f6f7" stroke="#8b969e"/>
  <text x="250" y="147" text-anchor="middle" class="label">User request</text>
  <text x="250" y="173" text-anchor="middle" class="detail">Fix the average and rerun the test.</text>
  <rect x="520" y="118" width="420" height="72" rx="6" fill="#f5f6f7" stroke="#8b969e"/>
  <text x="730" y="147" text-anchor="middle" class="label">Instructions and tool descriptions</text>
  <text x="730" y="173" text-anchor="middle" class="detail">Available session history</text>
  <path class="line" d="M250 190 V207 H410 V225"/>
  <path class="line" d="M730 190 V207 H550 V225"/>
  <rect class="app" x="290" y="225" width="380" height="64" rx="6"/>
  <text x="480" y="264" text-anchor="middle" class="label">Prepare the model input</text>
  <path class="line" d="M480 289 V330"/>
  <rect class="model" x="290" y="330" width="380" height="72" rx="6"/>
  <text x="480" y="360" text-anchor="middle" class="label">Model responds</text>
  <text x="480" y="386" text-anchor="middle" class="detail">Text and possible tool requests</text>

  <path class="line" d="M290 366 H223"/>
  <rect x="40" y="332" width="183" height="68" rx="6" fill="#f5f6f7" stroke="#8b969e"/>
  <text x="131" y="360" text-anchor="middle" class="label">Final answer</text>
  <text x="131" y="385" text-anchor="middle" class="detail">To the user</text>
  <path class="line" d="M480 402 V452"/>
  <text x="495" y="433" class="small">Tool request</text>
  <path class="app" d="M480 452 L642 516 L480 580 L318 516 Z"/>
  <text x="480" y="512" text-anchor="middle" class="label">Check</text>
  <text x="480" y="537" text-anchor="middle" class="label">permissions</text>

  <path class="line" d="M318 516 H235 V632"/>
  <text x="184" y="558" class="small">Allow</text>
  <path class="line" d="M642 516 H725 V632"/>
  <text x="743" y="558" class="small">Deny</text>
  <rect class="app" x="105" y="632" width="260" height="83" rx="6"/>
  <text x="235" y="663" text-anchor="middle" class="label">Run the tool</text>
  <text x="235" y="690" text-anchor="middle" class="detail">Return output or an error</text>
  <rect class="app" x="595" y="632" width="260" height="83" rx="6"/>
  <text x="725" y="663" text-anchor="middle" class="label">Do not run the tool</text>
  <text x="725" y="690" text-anchor="middle" class="detail">Record why it was blocked</text>
  <path class="line" d="M235 715 V752 H395 V782"/>
  <path class="line" d="M725 715 V752 H565 V782"/>
  <rect class="app" x="290" y="782" width="380" height="66" rx="6"/>
  <text x="480" y="822" text-anchor="middle" class="label">Add result to the conversation</text>
  <path class="line" d="M670 816 H930 V257 H670"/>
  <text x="952" y="540" text-anchor="middle" class="small" transform="rotate(-90 952 540)">If the run continues</text>
  <text x="40" y="892" class="small">Errors or time limits can also stop the run before a final answer.</text>
</svg>
