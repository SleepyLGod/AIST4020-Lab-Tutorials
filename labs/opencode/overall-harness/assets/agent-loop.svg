<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="920" viewBox="0 0 1100 920" role="img" aria-labelledby="title desc">
  <title id="title">Overall Harness: The OpenCode Repair</title>
  <desc id="desc">We prepare a task, project files, permission rules, and tests. OpenCode prepares model input, checks tool requests, runs allowed tools, and saves messages and results for later calls. Project files are accessed through tools, not all pasted into the input. After the run ends, we independently check the program, file changes, and report. A dashed arrow shows how those checks can guide changes to the setup for a future run.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#52606d"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #202a32; }
      .heading { font-size: 30px; font-weight: 700; }
      .section { font-size: 24px; font-weight: 700; }
      .label { font-size: 21px; font-weight: 700; }
      .detail { font-size: 19px; }
      .small { font-size: 17px; fill: #52606d; }
      .line { fill: none; stroke: #52606d; stroke-width: 2; marker-end: url(#arrow); }
      .app { fill: #ffffff; stroke: #278060; stroke-width: 1.5; }
      .model { fill: #eef3fd; stroke: #416cba; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1100" height="920" fill="#ffffff"/>
  <text x="40" y="48" class="heading">Overall Harness: The OpenCode Repair</text>

  <rect x="40" y="85" width="960" height="170" rx="6" fill="#f5f6f7" stroke="#8b969e"/>
  <text x="65" y="123" class="section">1. You prepare the task</text>
  <text x="65" y="164" class="label">Project files</text>
  <text x="65" y="194" class="detail">Requirements, program,</text>
  <text x="65" y="222" class="detail">data, and a test</text>
  <text x="390" y="164" class="label">Request</text>
  <text x="390" y="194" class="detail">Fix the average;</text>
  <text x="390" y="222" class="detail">test before and after</text>
  <text x="710" y="164" class="label">Permission rules</text>
  <text x="710" y="194" class="detail">Edit only grades.py;</text>
  <text x="710" y="222" class="detail">allow the test command</text>
  <path class="line" d="M520 255 V305"/>

  <rect x="40" y="305" width="960" height="395" rx="6" fill="#eef7f3" stroke="#278060" stroke-width="1.5"/>
  <text x="65" y="345" class="section">2. OpenCode runs the task</text>

  <rect class="app" x="65" y="385" width="255" height="110" rx="5"/>
  <text x="192" y="418" text-anchor="middle" class="label">Prepare model input</text>
  <text x="192" y="449" text-anchor="middle" class="detail">Instructions, conversation,</text>
  <text x="192" y="477" text-anchor="middle" class="detail">and tool descriptions</text>

  <path class="line" d="M320 440 H390"/>
  <rect class="model" x="390" y="385" width="230" height="110" rx="5"/>
  <text x="505" y="418" text-anchor="middle" class="label">Model</text>
  <text x="505" y="449" text-anchor="middle" class="detail">Request an action</text>
  <text x="505" y="477" text-anchor="middle" class="detail">or finish with an answer</text>

  <path class="line" d="M620 440 H690"/>
  <text x="655" y="400" text-anchor="middle" class="small">Tool</text>
  <text x="655" y="422" text-anchor="middle" class="small">request</text>
  <rect class="app" x="690" y="385" width="280" height="110" rx="5"/>
  <text x="830" y="418" text-anchor="middle" class="label">Check permissions</text>
  <text x="830" y="449" text-anchor="middle" class="detail">Run allowed tools:</text>
  <text x="830" y="477" text-anchor="middle" class="detail">read, edit, or test files</text>

  <path class="line" d="M830 495 V595 H750"/>
  <text x="840" y="531" class="small">Output, error,</text>
  <text x="840" y="553" class="small">or denial</text>
  <rect class="app" x="390" y="550" width="360" height="90" rx="5"/>
  <text x="570" y="585" text-anchor="middle" class="label">Save the conversation</text>
  <text x="570" y="616" text-anchor="middle" class="detail">Messages, requests, and results</text>
  <path class="line" d="M390 595 H192 V495"/>
  <text x="65" y="636" class="small">For the next model call,</text>
  <text x="65" y="660" class="small">if the run continues</text>
  <text x="390" y="674" class="small">Also available when you continue the same session</text>

  <path class="line" d="M520 700 V755"/>
  <text x="540" y="735" class="small">When the run ends</text>

  <rect x="40" y="755" width="960" height="145" rx="6" fill="#faf7ee" stroke="#a58a45" stroke-width="1.5"/>
  <text x="65" y="794" class="section">3. You check the result</text>
  <text x="65" y="834" class="label">Run your own test</text>
  <text x="65" y="866" class="detail">Does it return 90?</text>
  <text x="390" y="834" class="label">Inspect the diff</text>
  <text x="390" y="866" class="detail">Which files changed?</text>
  <text x="710" y="834" class="label">Check the report</text>
  <text x="710" y="866" class="detail">Does it match the actions?</text>

  <path class="line" stroke-dasharray="7 6" d="M1000 825 H1040 V170 H1000"/>
  <text x="1070" y="500" text-anchor="middle" class="detail" transform="rotate(-90 1070 500)">Use what you learn to improve the next run</text>
</svg>
