<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
  <title id="title">An investigation task leaves the main conversation and returns as advice</title>
  <desc id="desc">The main agent sends a focused request to a read-only investigator agent. The investigator agent reads files and returns findings. The main agent checks the advice, edits, and tests. Both agents use the same project folder, but keep separate conversations.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#374151"/></marker>
  </defs>
  <rect width="1000" height="510" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#182026">
    <text x="38" y="40" font-size="24" font-weight="700">One repair, two conversations</text>
    <text x="38" y="68" font-size="17" fill="#555f68">Example workflow, not a record of your run</text>
    <rect x="38" y="95" width="330" height="290" rx="6" fill="#eef6f5" stroke="#278577" stroke-width="2"/>
    <rect x="632" y="95" width="330" height="290" rx="6" fill="#f7f3fb" stroke="#9066ad" stroke-width="2"/>
    <text x="58" y="129" font-size="21" font-weight="700">Main agent</text>
    <text x="652" y="129" font-size="21" font-weight="700">Investigator agent</text>
    <text x="58" y="155" font-size="16" fill="#555f68">Main conversation</text>
    <text x="652" y="155" font-size="16" fill="#555f68">Child conversation</text>
    <text x="58" y="208" font-size="19">Ask for an investigation</text>
    <text x="652" y="208" font-size="19">Read files and locate the bug</text>
    <path d="M375,203 L622,203" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="499" y="185" text-anchor="middle" font-size="17">task request</text>
    <path d="M797,224 L797,265" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="652" y="297" font-size="19">Return a short recommendation</text>
    <text x="58" y="297" font-size="19">Check the advice</text>
    <path d="M625,292 L378,292" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="499" y="274" text-anchor="middle" font-size="17">task result</text>
    <path d="M200,310 L200,336" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="58" y="363" font-size="19">Edit and test the program</text>
    <text x="652" y="363" font-size="17" fill="#555f68">Read/search only; no edits or commands</text>
    <rect x="38" y="411" width="924" height="72" rx="6" fill="#f4f5f6" stroke="#c4c9ce"/>
    <text x="58" y="441" font-size="19" font-weight="700">Same project files, different permissions</text>
    <text x="58" y="468" font-size="17">Separate conversations do not create separate copies of the project.</text>
  </g>
</svg>
